<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="signup.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
  
</head>
<body>
  
  <div class="container">
    
    <div class="form active" id="loginForm">
      <h2>Login</h2>
      <input type="email" placeholder="Email " maxlength="25" required>
      <input type="password" placeholder="Password" name="password" id="password"  maxlength="10"> 
      <i class="fa-solid fa-eye" id="show-password"> </i>
      <button>Sign in</button>
      <p>Don't have an account? <span onclick="showSignUp()" class="link_text">Sign Up</span></p>
    </div>

    
    <div class="form" id="signupForm">
      <h2>Sign Up</h2>
      <input type="text" placeholder="Full Name" maxlength="50">
      <input type="email" placeholder="Email" maxlength="25">
      <input type="password" placeholder="Password" maxlength="10"> 
      <button>Sign Up</button>
      <p>Already have an account? <span onclick="showLogin()" class="linkk_text">Login</span></p>
    </div>
  </div>

  <script>
    function showSignUp() {
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("signupForm").classList.add("active");
    }

    function showLogin() {
      document.getElementById("signupForm").classList.remove("active");
      document.getElementById("loginForm").classList.add("active");
    }
     
    

   const showPassword = document.querySelector("#show-password");
const passwordField = document.querySelector("#password");

showPassword.addEventListener("click", function(){

    const isPassword = passwordField.getAttribute("type") === "password";
      passwordField.setAttribute("type", isPassword ? "text" : "password");

    if (this.classList.contains("fa-eye")) {
        this.classList.remove("fa-eye");
        this.classList.add("fa-eye-slash");
      } else {
        this.classList.remove("fa-eye-slash");
        this.classList.add("fa-eye");
      }
    });
    
  </script>
</body>
</html>
